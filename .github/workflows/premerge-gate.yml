name: Pre-merge Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Code Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Run linter - Ultracite changed files
        run: |
          set -e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          CHECKED_OUT_SHA="${{ github.sha }}"
          if [ -z "$BASE_SHA" ]; then
            echo "No PR base SHA available (workflow_dispatch?); skipping changed-file lint."
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "Base SHA $BASE_SHA not present locally; aborting."
            exit 1
          fi
          CHANGED_TMP=$(mktemp)
          trap 'rm -f "$CHANGED_TMP"' EXIT
          git diff --name-only --diff-filter=ACMRTUXB "$BASE_SHA" "$CHECKED_OUT_SHA" -- '*.js' '*.ts' '*.tsx' '*.jsx' '*.mjs' '*.cjs' > "$CHANGED_TMP"
          FILES=()
          while IFS= read -r f; do
            case "$f" in
              index.html|favicon.svg|icons.svg|archive/*|src/frontend/dist/*|docs/*) continue ;;
            esac
            [ -n "$f" ] && FILES+=("$f")
          done < "$CHANGED_TMP"
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed lintable files in this PR; skipping lint."
            exit 0
          fi
          echo "Linting ${#FILES[@]} changed file(s):"
          printf '  %s\n' "${FILES[@]}"
          npx ultracite check --max-diagnostics=10000 "${FILES[@]}"

  test:
    name: Backend Jest Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Run Jest test suite
        run: npm test

  build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd src/frontend && npm ci

      - name: Build React/Vite web application
        run: npm run build

  premerge-pass:
    name: premerge-pass
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always()
    steps:
      - name: Verify all pre-merge jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "Pre-merge status check failed."
            echo "Lint result: ${{ needs.lint.result }}"
            echo "Test result: ${{ needs.test.result }}"
            echo "Build result: ${{ needs.build.result }}"
            exit 1
          fi
          echo "All pre-merge checks passed successfully."
